[project]
name = "sciev"
version = "0.2.0"
description = "Sciev: typed decision heads on frozen masked-diffusion backbones with held-out calibration."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sciev"]
