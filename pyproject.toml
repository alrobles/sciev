[project]
name = "sciev"
version = "0.2.3"
description = "Typed decision heads on frozen masked-diffusion backbones with held-out calibration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Angel Robles" },
]
keywords = [
    "scientific-computing",
    "decision-models",
    "masked-diffusion",
    "calibration",
    "classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn>=0.23"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/alrobles/sciev"
Repository = "https://github.com/alrobles/sciev"
Issues = "https://github.com/alrobles/sciev/issues"
Releases = "https://github.com/alrobles/sciev/releases"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sciev"]
